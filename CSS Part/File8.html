<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice 8</title>

</head>
<style>
    html, body{
        margin: 0px;
    }
    .main{
        width: 100vw;
        background-image: url("/img/Header.jpg");
        border: 2px solid rgb(29, 29, 29);
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
    }

    #box1{
        padding-left: 18px;
        font-size: 20px;
        font-weight: bold;
        color: orange;
        font-family: cursive;
    }
    
    #box2 li{
        display: inline-block;
        padding-left: 15px;
    }
    #box2 a{
        font-size: 17px;
        text-decoration: none;
        color: white;
    }
    #box2 a:hover{
        text-decoration: rgb(155, 155, 155) underline;
        color: rgb(155, 155, 155);
    }

    #box3{
        margin-right: 20px; 
    }

    #image{
        width: 100vw;
        height: 100vh;
    }
</style>
<body>
    <div class="main">
        <div id="box1">
            <span>Piyush</span>
        </div>
        <div id="box2">
            <ul>
                <li><a href="">Home</a></li>
                <li><a href="">About</a></li>
                <li><a href="">Skill</a></li>
                <li><a href="">Contact</a></li>
            </ul>
        </div>
        <div id="box3">
            <button class="btn">Login</button>
            <button class="btn">Sign in</button>
        </div>
    </div>
    <div class="img">
        <img src="/img/Hotel.jpg" id="image">
    </div>
</body>
</html>
