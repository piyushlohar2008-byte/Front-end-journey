<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Concept</title>
</head>
<style>
    .container{
        height: 400px;
        background-color: #ffa600;
        border: 2px solid blue;
        display: flex;
        flex-direction: row;
        /* flex-wrap: wrap; */
        align-items: center;
        justify-content: space-evenly;
    }
    .box{
        margin: 5px;
        width: 100px;
        height: 100px;
        background-color: rgb(194, 194, 194);
        border: 2px solid black;
    }
    #id1{
        flex-shrink: 5;
        order: 2;
    }
    #id2{
        order: 5;
    }
    #id3{
        order: 1;
    }
</style>
<body>
    <div class="container">
        <div class="box" id="id1">Box-1</div>
        <div class="box" id="id2">Box-2</div>
        <div class="box" id="id3">Box-3</div>
        <div class="box" id="id4">Box-4</div>
    </div>
</body>
</html>
