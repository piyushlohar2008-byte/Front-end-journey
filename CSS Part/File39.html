<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid</title>
</head>
<style>
    .container{
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        /* gap 10px between all boxes in both direction (rows and column) */
        gap: 10px;
        /* gap 10px between all boxes in row direction */
        /* row-gap: 10px; */
        /* gap 10px between all boxes in column direction */
        /* column-gap: 10px; */
    }
    .Box{
        /* height: 100px;
        width: 100px; */
        border: 1px solid black;
        padding: 3px 0px;
        background-color: rgb(255, 194, 114);
        margin: 0px 0px;
        display: flex;
        align-items: center;
        justify-content: center; 
        padding: 5px 0px;
    }
    h1{
        text-align: center;
        color: red;
        padding-bottom: 20px;
    }
    @media (max-width: 680px){
        .container{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }
    }
</style>
<body>
    <h1>Simple Grid Peoperties in CSS</h1>
    <div class="container">
        <div class="Box">This is box 1</div>
        <div class="Box">This is box 2</div>
        <div class="Box">This is box 3</div>
        <div class="Box">This is box 4</div>
        <div class="Box">This is box 5</div>
        <div class="Box">This is box 6</div>
        <div class="Box">This is box 7</div>
        <div class="Box">This is box 8</div>
        <div class="Box">This is box 9</div>
        <div class="Box">This is box 10</div>
    </div>
</body>
</html>
