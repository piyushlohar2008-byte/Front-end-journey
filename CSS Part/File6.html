    <title>Navbar</title>

<style>
    html, body{
        margin: 2px;
        padding: 0px;
    }
    .container{
        border-top-left-radius: 40px;
        border-bottom-right-radius: 40px;
        background-color: rgb(0, 0, 95);
    }
    .container ul{
        list-style: none;
        overflow: auto;
        
    }
    .container li{
        float: left;
        padding: 15px 10px; 
    }
    .container a{
        color: white;
        text-decoration: none;
    }
    .container a:hover{
        color: rgb(160, 159, 159);
        text-decoration: underline;
    }
</style>
