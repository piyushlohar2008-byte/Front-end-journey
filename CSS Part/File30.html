<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variables</title>
</head>
<style>
    :root{
        /* In CSS we can create variables using --Symbol */
        --maxw: 400px;
        --margin: 10px 10px;
        --container-bg: rgba(247, 31, 31, 0.5);
        --box1-bg: rgba(192, 192, 192, 0.877);
        --box2-bg: rgba(76, 76, 250, 0.377);
        --box3-bg: rgba(48, 255, 186, 0.5);
        --h2-bg: rgba(223, 111, 32, 0.781);
        --h2-bg: rgba(40, 40, 252, 0.815);
        --h2-color: rgb(255, 255, 255);
    }
    .container{
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: var(--container-bg);
    }
    .box{
        width: 100px;
        height: 100px;
        border: 2px solid black;
        margin: var(--margin);
    }
    #item1{
        background-color: var(--box1-bg);
    }
    #item2{
        background-color: var(--box2-bg);
    }
    #item3{
        background-color: var(--box3-bg);
    }
    h2{
        text-align: center;
        background-color: var(--h2-bg);
        padding: 5px 0px 5px 0px;
        color: var(--h2-color);
        text-shadow: 3px 3px rgb(0, 0, 0);
    }
</style>
<body>
    <h2>CSS variables and coustom properties</h2>
    <div class="container">
        <div class="box" id="item1"></div>
        <div class="box" id="item2"></div>
        <div class="box" id="item3"></div>
    </div>
</body>
</html>
