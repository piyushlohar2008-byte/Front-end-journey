<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margin and Padding</title>
    <style>
        html, body{
            height: 100%;
            margin: 5px;
            padding: 0px;
        }
        .division{
            width: 400px;
            height: 240px;
            background-color: rgb(29, 21, 29);
            color: rgba(255, 255, 255, 0.979);
            font-size: 15px;
            margin-top: 0px;
            border-radius: 10px;
            background-image: url(https://images.unsplash.com/photo-1517487881594-2787fef5ebf7?ixlib=rb-1.2.1&ixid=eyJhcHBfaWQiOjEyMDd9&auto=format&fit=crop&w=1350&q=80);
            background-size: 400px 100px;
            background-position: 0px 0px;
            background-repeat: no-repeat;
    
        }
        #first{
            padding-top: 120px;
            padding-left: 10px;
            font-size: 24px;
        }
        #fir{
            margin-top:20px;
            padding:10px 20px;
            background:#38bdf8;
            border:none;
            border-radius:5px;
            color:black;
            cursor:pointer
        }
    </style>
</head>
<body>
    <div class="division">
        <p id="first">Piyush Notes</p>
        <span id="fir">View</span>
    </div>
    </div>
</body>
</html>
