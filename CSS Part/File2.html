<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html, body{
            margin: 0%;
            
        }
        .navBar{
            border-radius: 20px;
            background-color: rgb(255, 138, 4);
        }
        .navBar ul{
            list-style: none;
            overflow: auto;
        }
        .navBar li{
            float: left;
            padding: 10px 5px;
        }
        .navBar a{
            text-decoration: none;
            color: rgb(37, 0, 248);
        }
        .navBar a:hover{
           color: rgb(26, 10, 121);
           cursor: pointer;
        }
        .container{
            float: right;
            margin: 10px 20px;
        }
        #Search{
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <nav class="navBar">
        <ul>
            <li><a href="">Home</a></li>
            <li><a href="">About</a></li>
            <li><a href="">Service</a></li>
            <li><a href="">Contact</a></li>
            <div class="container">
                <input type="text" name="Search" id="Search" placeholder="Search Website">
            </div>
        </ul>
    </nav>
</body>
</html>
