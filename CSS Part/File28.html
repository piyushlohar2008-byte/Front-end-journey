<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Property</title>
</head>
<style>
    .container{
        display: flex;
    }
    .Boxes{
        border: 2px solid black;
        margin: 10px;
        width: 150px;
        height: 150px;
    }
    #box-1{
        /* The order property used to display order of box*/
        order: 1;
        background-color: rgb(164, 68, 255, 0.5);
    }
    #box-2{
        background-color: rgb(199, 53, 53, 0.5);
    }
    #box-3{
        order: 2;
        background-color: rgb(235, 1, 1, 0.75);
    }
    #box-4{
        background-color: rgb(3, 252, 252, 0.5);
    }
</style>
<body>
    <div class="container">
        <div class="Boxes" id="box-1"></div>
        <div class="Boxes" id="box-2"></div>
        <div class="Boxes" id="box-3"></div>
        <div class="Boxes" id="box-4"></div>
    </div>
</body>
</html>
