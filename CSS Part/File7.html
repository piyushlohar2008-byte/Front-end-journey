<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positions</title>
</head>
<style>
    .megaBox{
        border: 2px solid black;
        background-color: antiquewhite;
        width: 100%;
        height: 2200px;
    }
    .parent{
        border: 2px solid rgb(255, 0, 0);
        background-color: rgb(0, 2, 92);
        width: 100%;
        height: 500px;
    }
    .container{
        background-color: rgb(101, 238, 192);
        border: 2px solid gray;
        margin: 10px 10px;
        width: 100px;
        height: 100px;
        display: inline-block;
    }
    #box1{
        position: sticky;
        top: 10px;
    }
    #box2{
        position: relative;
        left: 320px;
        top: 40px;
    }
    #box3{
        position:fixed;
        right: 0px;
        top: 5px;
    }
</style>
<body>
    <div class="megaBox">
        <div class="parent">
            <div class="container" id="box1">1</div>
            <div class="container" id="box2">2</div>
            <div class="container" id="box3">3</div>
        </div>
    </div>
</body>
</html>
