<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fonts in CSS</title>
    <style>
      html, body {
        margin: 0%;
        padding: 0%;
        height: 100%;
        width: 100%;
      }
      h1{
        background:rgb(0, 0, 34);
        font-family: Arial ,cursive , Times, serif;
        text-align: center;
        color: #38bdf8;
        height: 250px;
      }
      p{
        background:#000;
        font-family:'Times New Roman';
        font-size: 18px;
        text-align: justify;   
        color: white;
        height: 200px;
      }
    </style>
  </head>
  <body>
    <h1>Font Family</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Iusto quisquam eveniet, natus dolor mollitia, asperiores, repellat numquam laboriosam ullam quod exercitationem eaque fugiat nulla sed? Nesciunt neque molestiae omnis esse.</p>
  </body>
</html>
