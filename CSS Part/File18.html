<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple positions in CSS</title>
    <link href="https://fonts.googleapis.com/css?family=Exo:100,200,300,regular,500,600,700,800,900,100italic,200italic,300italic,italic,500italic,600italic,700italic,800italic,900italic" rel="stylesheet" />
</head>
<style>
    /* This is the main box of website */
    /* That contains following content */
    .container{
        background-image: url(https://wallpaperaccess.com/full/834264.jpg);
        background-size: 1020px 650px;
        height: 620px;
        width: 100%;
        border: 2px solid black;
        background-repeat: no-repeat;
    }
 
    /* This is the image and content */ 
    /* Displayed in the left-top of page */
    #id1{
        padding-left: 15px;
        padding-top: 0px;
        height: 100px;
        width: 150px;
    }
    #id1 img{
        height: 120px;
        width: 120px;
    }
    #id1 img:hover{
        cursor: move;
    }
    .Box p{
        padding-left: 15px;
        line-height: 0px;
        font-family: Exo;
        color: white;
        position: absolute;
        top: 105px;
    }
    .Box p:hover{
        cursor: default;
    }

    /* This is the navbar of web page */
    /* Displayed in center of web page */
    #id2{
        position: relative;
        left: 350px;
        height: 60px;
        width: 350px;
        bottom: 95px;
    }
    .navBar ul{ 
        overflow: auto;
    }
    .navBar li{
        display: inline-block;
        text-decoration: none;
        list-style: none;
        padding-left: 15px;
    }
    .navBar a{
        font-size: 18px;
        color: white;
        text-decoration: none;
    }
    .navBar a:hover{
        color: rgb(163, 163, 163);
        text-decoration: underline;
    }
    
    /* This is the buttons of web page */
    /* Displayed in top-right side */
    #id3{
        position: fixed;
        right: 0px;
        top: 25px;
        height: 100px;
        width: 140px;
        padding-left: 30px;
        padding-top: 0px;
        margin-left: 30px;
    }
    .btn{
        padding: 5px 10px;
    }
    .btn:hover{
        background-color: rgb(255, 72, 0);
        transform: scale(1.1);
    }
</style>
<body>
    <div class="container">
        <div class="Box" id="id1">
            <img src="https://tse3.mm.bing.net/th/id/OIP.EDlYd3vYQ6vFPsLT3Lby_QHaHa?pid=Api&P=0&h=180" alt="">
            <p>Royal Fitness</p>
        </div>
        <div class="Box" id="id2">
            <nav class="navBar">
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Form</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>
        </div>
        <div class="Box" id="id3">
            <button class="btn">Login</button>
            <button class="btn">Email</button>
        </div>
    </div>
</body>
</html>
