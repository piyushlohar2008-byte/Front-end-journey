<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transtions in CSS</title>
</head>
<style>
    .container{
        height: 200px;
        width: 500px;
        background-color: antiquewhite;
        border: 2px solid black;
    }
    #box{
        height: 120px;
        width: 100px;
        margin-top: 10px;
        margin-left: 10px;
        background-color: red;
        border: 2px solid black;
        transition-property: all;
        transition-duration: 0.5s;
    }
    #box:hover{
        background-color: blue;
    }
</style>
<body>
    <div class="container">
        <div id="box"></div>
    </div>
</body>
</html>
