<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transform</title>
</head>
<style>
    *{
        margin: 0px;
        padding: 0px;
    }
    .container{
        background-color: rgb(252, 228, 198);
        display: flex;
        align-items: center;
        justify-content: center;
        height: 80vh;
    }
    #box{
        display: flex;
        justify-content: center;
        align-items: center;
        height: 200px;
        width: 200px;
        border: 1px solid rgb(51, 51, 51);
        background-color: rgba(147, 47, 240, 0.777);
        transition: all 0.3s ease-in-out;
    }
    #box:hover{
        /* transform: rotate(360deg); */
        /* transform: skew(-20deg); */
        /* transform: matrix(10); */
        transform: scale(1.1);
        background-color: rgb(147, 47, 240, 0.666);
        box-shadow: 3px 3px 10px rgb(146, 146, 146), -3px -3px 10px rgb(145, 145, 145);
    }
</style>
<body>
    <div class="container">
        <div id="box">This is a box</div>
    </div>
</body>
</html>
