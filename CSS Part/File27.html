<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow</title>
</head>
<style>
    .Box{
        width: 200px;
        height: 200px;
        margin-left: 25px;
        box-shadow: 10px 0px blue, 0px 10px red, -10px -0px blue, -0px -10px red;
        display: inline-block;
        position: relative;
        left: 40px;
        top: 25px;
        /* margin-top: 20px; */
    }
    #item1{
        background-color: rgba(250, 151, 21, 0.5);
    }
    #item2{
        /* order: 2; */
        background-color: rgb(142, 250, 214, 0.5);
    }
    #item3{
        background-color: rgba(230, 227, 106, 0.438);
    }
    #item4{
        background-color: rgb(155, 55, 248, 0.5);
    }
    h2{
        text-align: center;
    }
</style>
<body>
    <h2>Shadow in both direction</h2>
    <div class="Box" id="item1"></div>
    <div class="Box" id="item2"></div>
    <div class="Box" id="item3"></div>
    <div class="Box" id="item4"></div>
</body>
</html>
