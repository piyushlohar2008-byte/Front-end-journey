<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table in HTML</title>
</head>
<body>
    <table>
        <caption>Student Data</caption>  
        <!-- Head line of table -->
        <tr>
            <thead>
                <!-- this content will be displayed in the head of the table -->
                <th>Name</th>
                <th>Dept</th>
                <th>Rollno</th>
            </thead>
        </tr>
        <tr>
            <tbody>
                <!-- this content will be displayed in the body of the table -->
            <td>Ganesh</td>
            <td>CSE</td>
            <td>50</td>
            </tbody>
        </tr>
        <tr>
            <td>Shubham</td>
            <td>CSE</td>
            <td>21</td>
        </tr>   
        <tr>
            <td>Shivam</td>
            <td>Civil</td>
            <td>39</td>
        </tr>
        </tr>
    </table>
</body>
</html>
