<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>
<body>

    <!-- unordered list -->
    <ul style="color: red;">
        <li>Apple</li>
        <ul>
            <!-- this is the under list of apple -->
            <li>Color : Red</li>
            <li>Season : Winter</li>
        </ul>
        <li>Mango</li>
        <ul>
            <li>Color : Yellow</li>
            <li>Season : Summer</li>
        </ul>
        <li>Banana</li>
    </ul>

    <!-- ordered list -->
    <ol style="color: blue;">
        <li>Piyush</li>
        <ol>
            <li>College : SGI</li>
            <li>Education : Master is Computer</li>
        </ol>
        <li>Aditya</li>
        <ol>
            <li>College : SGI</li>
            <li>Education : Full Stack Web Development</li>
        </ol>
    </ol>
</body>
</html>
