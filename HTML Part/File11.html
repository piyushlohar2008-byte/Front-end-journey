<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CheckBox</title>
</head>
<body>
    <h1>Check-box in HTML</h1>
    <form action="">      
        <label for="C++">
            <input type="checkbox" value="math" name="subject" id="C++"> math
        </label>
        <label for="C">
            <input type="checkbox" value="C" name="subject" id="C"> C
        </label>
        <label for="PHP">
            <input type="checkbox" value="PHP" name="subject" id="PHP"> PHP
        </label><br><br>
        <!-- This is used for selecting the city using checkboxes -->

    </form>
</body>
</html>
