<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Form</title>
</head>
<body>
    <form action="/action.php">
        <input type="text" placeholder="Enter username"><br>
        <input type="password" placeholder="Enter password"><hr>
        <!-- This is for simple login form -->

        <textarea name="Feedback"  cols="30" rows="10"></textarea><br>
        <!-- used for multiline input from user -->

        <input type="submit" value="Submit">
        <!-- used for submit data to backend -->
        
        <input type="reset" value="Reset">
        <!-- used to reset/clear form -->
    </form>
</body>
</html>
