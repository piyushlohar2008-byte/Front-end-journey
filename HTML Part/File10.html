<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Buttons</title>
</head>
<body>
    <form action="">
        <label for="101">
            <input type="radio" value="Java" name="Class" id="101"> Java
             <!-- The value attribute used for sending data to the server -->
             <!-- The name attribute is used to group the radio buttons together  -->
        </label>
        <label for="102">
            <input type="radio" value="Python" name="Class" id="102"> Python
            <!-- The for attribute used to link the label with the input element -->
        </label>
        <br>
        <!-- This is content radio button only one option to choose -->
    </form>
</body>
</html>
