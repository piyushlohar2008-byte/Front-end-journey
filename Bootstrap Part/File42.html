<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap list-group</title>
    <link rel="stylesheet" href="css/bootstrap.css">
    <script src="js/bootstrap.bundle.js"></script>
</head>
<body>
    <div class="container mt-4 ">
        <div class="row">
            <div class="col col-6 ">
                <ul class="list-group ">
                    <li class="list-group-item active">list-1</li>
                    <li class="list-group-item disabled">list-2</li>
                    <li class="list-group-item">list-3</li>
                    <li class="list-group-item">list-4</li>
                    <li class="list-group-item">list-5</li>
                </ul>
            </div>
            <div class="col col-6 border border-3">
                <ul class="list-group mt-2">
                    <a href="#" class="list-group-item btn btn-outline-primary" >Click</a>
                    <br>
                    <input class="list-group-item btn btn-outline-danger" type="button" value="button">
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
