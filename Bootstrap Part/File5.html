<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap flexbox</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
    <div class="d-flex bg-dark justify-content-sm-start justify-content-center flex-wrap" style="min-height: 200px;">
        <div class="bg-warning p-3 m-2">This is box-1</div>
        <div class="bg-danger p-3 m-2">This is box-2</div>
        <div class="bg-primary p-3 m-2">This is box-3</div>
        <div class="bg-primary-subtle p-3 m-2">This is box-4</div>
    </div>

    <div class="d-flex bg-dark justify-content-sm-between justify-content-center mt-2 flex-wrap" style="min-height: 200px;">
        <div class="bg-body-secondary p-3 m-2">This is box-1</div>
        <div class="bg-success p-3 m-2">This is box-2</div>
        <div class="bg-danger-subtle p-3 m-2">This is box-3</div>
        <div class="bg-info p-3 m-2">This is box-4</div>
    </div>

    <div class="d-flex flex-column bg-dark justify-content-center mt-2" style="min-height: 200px;">
        <div class="bg-warning p-3 m-2">This is box-1</div>
        <div class="bg-danger p-3 m-2">This is box-2</div>
        <div class="bg-primary p-3 m-2">This is box-3</div>
        <div class="bg-primary-subtle p-3 m-2">This is box-4</div>
    </div>
</body>
</html>
