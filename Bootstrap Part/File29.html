<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media</title>
    <link rel="stylesheet" href="/CSS/bootstrap.css">
    <script src="/js/bootstrap.bundle.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        body {
            background-color: rgb(0, 0, 0);
        }
        .container {
            display: flex;
            gap: 1rem;
        }

        /* youtube */
        .social-media {
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 100px;
            border: 4px solid white;
            position: relative;
        }
        .social-media::before {
            content: "";
            inset: 0;
            height: 100%;
            width: 100%;
            border-radius: 100px;
            position: absolute;
            background: linear-gradient(to top, rgba(255, 0, 0, 0.800) ,rgba(255, 0, 0, 0.800));
            transform: scaleY(0);
            transition: 0.5s;
        }
        .social-media:hover::before {
            transform: scaleY(1);
        }
        /* youtube */

        /* instagram */
        .social-media-2 {
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 100px;
            border: 4px solid white;
            position: relative;
        }
        .social-media-2::before {
            content: "";
            inset: 0;
            height: 100%;
            width: 100%;
            border-radius: 100px;
            position: absolute;
            background: linear-gradient(to top, rgba(70, 156, 255, 0.800) ,rgba(70, 157, 255, 0.800));
            transform: scaleY(0);
            transition: 0.5s;
        }
        .social-media-2:hover::before {
            transform: scaleY(1);
        }
        /* instagram */

        /* facebook */
        .social-media-3 {
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 100px;
            border: 4px solid white;
            position: relative;
        }
        .social-media-3::before {
            content: "";
            inset: 0;
            height: 100%;
            width: 100%;
            border-radius: 100px;
            position: absolute;
            background: linear-gradient(to top, rgb(0, 73, 156) ,rgba(0, 73, 156));
            transform: scaleY(0);
            transition: 0.5s;
        }
        .social-media-3:hover::before {
            transform: scaleY(1);
        }
        /* facebook */


        /* github */
        .social-media-4 {
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 100px;
            border: 4px solid white;
            position: relative;
        }
        .social-media-4::before {
            content: "";
            inset: 0;
            height: 100%;
            width: 100%;
            border-radius: 100px;
            position: absolute;
            background: linear-gradient(to top, #6e5494 ,#6e5494);
            transform: scaleY(0);
            transition: 0.5s;
        }
        .social-media-4:hover::before {
            transform: scaleY(1);
        }
        /* github */
        
        i {
            font-size: 1.3rem;
            color: white;
            position: relative;
            z-index: 999;
            transition: all 0.4s linear;
        }
        i:hover {
            transform: rotateY(360deg);
        }
    </style>
    
</head>
<body>
    <div class="container mt-5">
        <div class="social-media social">
            <a href="https://www.youtube.com/" target="_blank"><i class="fa-brands fa-youtube"></i></a>
        </div>
        <div class="social-media-2 social">
            <a href="https://www.youtube.com/" target="_blank"><i class="fa-brands fa-instagram"></i></a>
        </div>
        <div class="social-media-3 social">
            <a href="https://www.youtube.com/" target="_blank"><i class="fa-brands fa-facebook-f"></i></a>
        </div>
        <div class="social-media-4 social">
            <a href="https://www.youtube.com/" target="_blank"><i class="fa-brands fa-github"></i></a>
        </div>
    </div>
</body>
</html>
