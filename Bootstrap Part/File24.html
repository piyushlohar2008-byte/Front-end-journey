<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Carousel Interval with caption</title>
    <link rel="stylesheet" href="/CSS/bootstrap.css">
    <script src="/js/bootstrap.bundle.js"></script>
    <style>
        .carousel-item img {
            max-height: 500px;
        }

        .carousel-caption {
            color: white !important;
        }
    </style>
</head>

<body>
    <section class="container pt-4">
        <section class="row">
            <section class="col col-12">
                <div id="carouselExampleInterval" class="carousel slide" data-bs-ride="carousel">

                    <!-- carousel indicator  -->
                    <div class="carousel-indicators">
                        <button type="button" data-bs-target="#carouselExampleInterval" data-bs-slide-to="0"
                            class="active" aria-current="true" aria-label="Slide 1"></button>
                        <button type="button" data-bs-target="#carouselExampleInterval" data-bs-slide-to="1"
                            aria-label="Slide 2"></button>
                        <button type="button" data-bs-target="#carouselExampleInterval" data-bs-slide-to="2"
                            aria-label="Slide 3"></button>
                    </div>

                    <!-- carousel inner classes and there item  -->
                    <div class="carousel-inner">
                        <div class="carousel-item active" data-bs-interval="3000">
                            <img src="/images/Iron man 2.jpg" class="d-block img-fluid w-100" alt="...">
                            <div class="carousel-caption d-none d-md-block">
                                <h4>First slide label</h4>
                                <p>Some representative placeholder content for the first slide.</p>
                            </div>
                        </div>
                        <div class="carousel-item" data-bs-interval="3000">
                            <img src="/images/Spider-man 2.jpg" class="d-block img-fluid w-100" alt="...">
                            <div class="carousel-caption d-none d-md-block">
                                <h4>Second slide label</h4>
                                <p>Some representative placeholder content for the second slide.</p>
                            </div>
                        </div>
                        <div class="carousel-item" data-bs-interval="3000">
                            <img src="/images/Spider-man 3.jpg" class="d-block img-fluid w-100" alt="...">
                            <div class="carousel-caption d-none d-md-block">
                                <h4>Third slide label</h4>
                                <p>Some representative placeholder content for the third slide.</p>
                            </div>
                        </div>
                    </div>

                    <!-- Slider previous and next buttons  -->
                    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleInterval"
                        data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Previous</span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleInterval"
                        data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Next</span>
                    </button>

                </div>
            </section>
        </section>
    </section>
</body>

</html>
