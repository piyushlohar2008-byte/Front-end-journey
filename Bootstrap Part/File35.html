<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap container</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>
    .box {
        height: 40px;
        margin-bottom: 0.5rem;
    }
    .container-fluid {
        background-color: red;
    }
    .container-xxl {
        background-color: blue;
    }
    .container-xl {
        background-color: green;
    }
    .container-lg {
        background-color: gray;
    }
    .container-md {
        background-color: orange;
    }
    .container-sm {
        background-color: purple;
    }
    .container {
        background-color: cyan;
    }
</style>
<body>
    <div class="container-fluid box"></div>
    <div class="container-xxl box"></div>
    <div class="container-xl box"></div>
    <div class="container-lg box"></div>
    <div class="container-md box"></div>
    <div class="container-sm box"></div>
    <div class="container"></div>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</html>
