<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Modal design</title>
    <link rel="stylesheet" href="File21.css">
    <link rel="stylesheet" href="/CSS/bootstrap.css">
    <script src="/js/bootstrap.bundle.js"></script>
</head>

<body>
    <!-- Button trigger modal -->
    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">
        Click here
    </button>

    <!-- Modal -->
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-white text-center">

                    <div class="modal-header border-0">
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>

                <div class="modal-body">
                    <h4 class="modal-title mb-2">Contact Form</h4>
                    <p>Fill the form and get more information about us</p>
                    <div class="group">
                        <input type="text" class="form-control" placeholder="Enter your name">
                        <button type="submit" class="btn btn-primary">Submit</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>
</body>

</html>
