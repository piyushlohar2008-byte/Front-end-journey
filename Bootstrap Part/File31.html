<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Collapse-2</title>
    <link rel="stylesheet" href="/CSS/bootstrap.css">
    <script src="/js/bootstrap.bundle.js"></script>
</head>

<body>
    <section class="container mt-4">
        <section class="row">
            <div class="col col-12 text-center text-success mb-3">
                <h3>Bootstrap 5 horizontal collapsing animation</h3>
            </div>
            <div class="col col-10">
                <div>
                    <button class="btn btn-primary" type="button" data-bs-toggle="collapse"
                        data-bs-target="#collapseHorizontal" aria-expanded="false"
                        aria-controls="collapseWidthExample">
                        Toggle width collapse
                    </button>
                </div>

                <div style="min-height: 120px;">
                    <div class="collapse collapse-horizontal mt-3" id="collapseHorizontal">
                        <div class="card card-body" style="width: 350px; text-align: justify;">
                            This is some placeholder content for a horizontal collapse. It’s hidden by default and shown
                            when triggered.
                        </div>
                    </div>
                </div>

            </div>
        </section>
    </section>
</body>

</html>
