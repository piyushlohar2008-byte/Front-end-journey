<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap button classes</title>
    <link href="/CSS/bootstrap.min.css" rel="stylesheet">
    <script src="/js/bootstrap.bundle.min.js"></script>
    <style>
        .container {
            border: 5px solid rgb(0, 170, 0);
        }
        .row {
            border: 6px solid skyblue;
        }
        .height-property {
            height: 200px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row p-3 gap-3">
            <div class="col col-12">
                <!-- there are 3 ways to create button in bootstrap -->
                <button class="btn btn-primary">Button</button>
                <button type="=submit" class="btn btn-warning">Button</button>
                <a href="#" class="btn btn-danger">Button</a>
                <input type="button" value="button" class="btn btn-dark">
            </div>

            <div class="col col-12">                
                <!-- Button outline classes -->
                <button class="btn btn-outline-danger">Danger</button>
                <button class="btn btn-outline-primary">Danger</button>
                <button class="btn btn-outline-warning">Danger</button>
            </div>

            <div class="col col-12">
                <!-- button size class in bootstrap -->
                <button class="btn btn-info btn-lg">Button large</button>
                <button class="btn btn-secondary">Button medium</button>
                <button class="btn btn-success btn-sm">Button small</button>
            </div>

            <div class="col col-6 d-grid gap-3">
                <!-- Use of grid in root element button get full width of parent element as there width -->
                <button class="btn btn-primary">Button Primary</button>
                <button class="btn btn-warning">Button Warning</button>
                <button class="btn btn-danger">Button Danger</button>
            </div>

            <div class="col col-12">
                <!-- Button active and disbled class -->
                <button class="btn btn-danger active">Active</button> 
                <button class="btn btn-primary disabled">Disbled</button> 
            </div>
        </div>
    </div>
</body>
</html>
