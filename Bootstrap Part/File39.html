<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap forms classes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container bg-warning-subtle">
        <form>
            <!-- simple form -->
            <div class="row row-cols-1 row-cols-md-2 bg-primary">
                <div class="col pt-2">
                    <div class="mb-3">
                        <label for="exampleFormControlInput1" class="form-label text-white">Email address</label>
                        <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="Enter your email">
                      </div>
                </div>
                <div class="col mt-0 mt-md-2">
                    <div class="pb-3">
                        <label for="exampleFormControlTextarea1" class="form-label text-white">Example textarea</label>
                        <textarea class="form-control" id="exampleFormControlTextarea1" rows="1"></textarea>
                    </div>
                </div>
            </div>

              <!-- form size -->
              <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 bg-primary-subtle justify-content-md-center py-3 ">
                <div class="col">
                    <input class="form-control form-control-lg mb-2" type="text" placeholder=".form-control-lg" aria-label=".form-control-lg example">
                </div>
                <div class="col mt-0 mt-md-1">
                    <input class="form-control mb-2" type="text" placeholder="Default input"  aria-label="default input example">
                </div>
                <div class="col mt-0 mt-lg-2">
                    <input class="form-control form-control-sm" type="text" placeholder=".form-control-sm" aria-label=".form-control-sm example">
                </div>
              </div>                           

              <!-- disable and readonly text  -->
              <div class="row row-cols-1 row-cols-md-2 py-4 bg-dark">
                <div class="col">
                    <input class="form-control mb-3 mb-md-0" type="text" placeholder="Disabled input" aria-label="Disabled input example" disabled>
                </div>
                <div class="col">
                    <input class="form-control" type="text" value="Disabled readonly input" aria-label="Disabled input example" disabled readonly>
                </div>
              </div>
              
              <div class="row row-cols-1 row-cols-md-2 bg-info pb-4">
                <div class="col">
                    <!-- Data list  -->
                      <label for="exampleDataList" class="form-label"></label>
                      <input class="form-control" list="datalistOptions" id="exampleDataList" placeholder="Type to search...">
                      <datalist id="datalistOptions">
                        <option value="Mumbai">
                        <option value="Kolhapur">
                        <option value="Pune">
                        <option value="Bengalore">
                        <option value="Odisa">
                      </datalist>
                </div>
                <div class="col mt-2 mt-md-4">
                    <!-- select in bootstrap -->
                    <select class="form-select form-select-sm pb-2" aria-label="Large select example">
                        <option selected>Open this select menu</option>
                        <option value="1">Orange</option>
                        <option value="2">White</option>
                        <option value="3">Green</option>
                      </select>
                </div>
              </div>

              <!-- file input in bootstrap -->
              <div class="row row-cols-1 row-cols-sm-2 row-cols-xl-4 py-3 justify-content-center">
                <div class="col">
                    <div class="mb-3">
                        <label for="formFile" class="form-label">Default file input example</label>
                        <input class="form-control" type="file" id="formFile">
                    </div>
                </div>
                <div class="col">
                    <div class="mb-3">
                        <label for="formFileMultiple" class="form-label">Multiple files input example</label>
                        <input class="form-control" type="file" id="formFileMultiple" multiple>
                    </div>
                </div>
                <div class="col">
                    <div class="mb-3">
                        <label for="formFileDisabled" class="form-label">Disabled file input example</label>
                        <input class="form-control" type="file" id="formFileDisabled" disabled>
                    </div>
                </div>
                <div class="col">
                    <div class="mb-3">
                        <label for="formFileSm" class="form-label">Small file input example</label>
                        <input class="form-control form-control-sm" id="formFileSm" type="file">
                    </div>
                </div>
                <div class="col">
                    <div>
                        <label for="formFileLg" class="form-label">Large file input example</label>
                        <input class="form-control form-control-lg" id="formFileLg" type="file">
                    </div>
                </div>
              </div>
   
              <div class="row bg-secondary pb-3">
                <div class="col d-flex col-5 col-sm-3 col-md-2 m-auto justify-content-center">
                    <div>
                        <!-- input color picker -->
                    <label for="exampleColorInput" class="form-label mt-3 text-white">Color picker</label>
                    <input type="color" class="form-control form-control-color ms-3" id="exampleColorInput" value="#000" title="Choose your fav color">
                    </div>
                </div>
              </div>
        </form>
    </div>
</body>
</html>
