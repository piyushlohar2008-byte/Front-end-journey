<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap card</title>
    <link rel="stylesheet" href="/CSS/bootstrap.css">
    <script src="/js/bootstrap.bundle.js"></script>
</head>
<body>
    <div class="container py-4">
        <div class="row">
            <div class="col col-4">
                <!-- In Bootstrap, a Card is a flexible, extensible content container used to display structured information like text, images, buttons, and links cleanly. -->
                <div class="card">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT63vWxwVgOiH6RXIi8fW852IGM_gTtbidrXWOonw-OBA&s=10" class="card-img-top img-fluid" alt="...">

                    <!-- The primary use of the .card-body class in Bootstrap is to define the main content container inside a card component. -->
                    <div class="card-body">
                        <h5 class="card-title">Card title</h5>
                        <p class="card-text">Some quick example text to build on the card title and make up the bulk of
                            the card content.</p>
                        <a href="#" class="btn btn-primary">Go somewhere</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
